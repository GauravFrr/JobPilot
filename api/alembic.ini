# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate new migration files
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# timezone = UTC

# max length of characters to clone to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow scientists to run migrations
# with multiple heads.
# sourceless = false

# version location specification; this defaults
# to alembic/versions.  when using multiple version
# directories, paths must be separated by spaces.
# version_locations = %(here)s/bar %(here)s/bat alembic/versions

# version path separator; as above, this defaults to the system separator.
# version_path_separator = :

# set to 'true' to search for scripts recursively
# recursive_version_locations = false

# the database URL is set dynamically in env.py, so we leave it blank here
sqlalchemy.url = postgresql://postgres:postgres@localhost/jobpilot

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
